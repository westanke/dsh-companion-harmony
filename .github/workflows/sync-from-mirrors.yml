# 从镜像同步到 GitHub（Gitee / AtomGit → GitHub）
#
# 为什么需要它：国内网络下 github.com:443 经常被断（本机实测 TLS handshake 中断 / 连接超时），
# 而 api.github.com 与 gitee.com 是通的。与其每次在本地苦等 GitHub，不如换个方向：
# 本地只推 Gitee / AtomGit，让**运行在 GitHub 服务器上**的 Runner 去把镜像拉回来推到 GitHub
# —— Runner 出网正常，能访问 gitee.com / atomgit.com，彻底绕开本地到 GitHub 的网络问题。
#
# 设计取舍：
# - **只做快进（--ff-only）**：镜像落后就拉齐；镜像与 GitHub 分叉就跳过并报错，绝不强推，
#   避免把 GitHub 上可能存在的独有提交冲掉。
# - 镜像地址写死在 MIRRORS 里，新增镜像加一行即可；不可达的镜像会被跳过、不影响其它镜像。
# - 这是**镜像 → GitHub 的单向补齐**；GitHub 上新增的提交不会反向推回镜像（本地正常推镜像即可）。
# - **推送用 `secrets.SYNC_PAT` 而不是默认 `GITHUB_TOKEN`**：后者天生不带 `workflows` 权限，
#   待推送区间一旦含 `.github/workflows/` 下的文件就会被 GitHub 拒绝，而且会让整条链永久停摆
#   （后续每次快进都包含那一笔）—— 2026-10-16 实测踩到，详见 PORT-MAP 收尾十一 坑 C。
#   secret 缺失时表达式退回 `github.token`：普通提交仍能推，只是 workflow 提交会失败。
#
# 端到端验证（2026-10-16）：本 workflow 接入 `SYNC_PAT` 后，特地把改动**只推镜像**、
# 再手动触发本链，验证 Runner 能把含 `.github/workflows/` 改动的提交推回 GitHub ——
# 即坑 C 的「永久停摆」已消除。结果记于 PORT-MAP 收尾十一。

name: 从镜像同步（Gitee / AtomGit → GitHub）

on:
  schedule:
    # 每 30 分钟一次（GitHub 高峰可能延迟，属正常）
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 GitHub 仓库（含全部历史，供快进合并）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 用带 `workflow` 权限的令牌，否则 push 不回含 .github/workflows/ 的提交（坑 C）。
          # 表达式带 `|| github.token` 兜底：secret 未配置时退回默认令牌，普通提交照样能推，
          # 只有 workflow 提交会失败 —— 退化得比整条链挂掉温和。
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: 配置提交者
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 逐个镜像快进并推回 GitHub
        env:
          BRANCH: master
          # 名称|地址，一行一个；新增镜像在此加一行即可
          MIRRORS: |
            gitee|https://gitee.com/westanke/dsh-companion-harmony.git
            atomgit|https://atomgit.com/westanke163/dsh-companion-harmony.git
        run: |
          set -u
          git checkout "$BRANCH"
          while IFS='|' read -r name url; do
            [ -z "${name:-}" ] && continue
            echo "===== 镜像 $name ($url) ====="
            if ! git ls-remote --heads "$url" "$BRANCH" >/dev/null 2>&1; then
              echo "跳过：$name 仓库不可达或还不存在"
              continue
            fi
            git remote remove "$name" 2>/dev/null || true
            git remote add "$name" "$url"
            if ! git fetch --no-tags "$name" "$BRANCH"; then
              echo "跳过：$name 拉取失败"
              continue
            fi
            if ! git merge --ff-only FETCH_HEAD; then
              echo "跳过：$name 不是 GitHub 的后代（两边分叉），不做强推"
              continue
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "完成：$name → GitHub 已快进到 $(git rev-parse --short HEAD)"
            else
              # GITHUB_TOKEN **没有** workflows 权限：只要待推送的提交里含 .github/workflows/ 下的
              # 文件，GitHub 就会拒绝（原文：refusing to allow a GitHub App to create or update
              # workflow ... without `workflows` permission）。这不是网络或 general 权限问题，
              # 换什么 --force 都没用，只能改用带 workflow 权限的令牌直推 / REST 补推。
              # 后果是**这条链会一直卡住**（后续每次快进都包含那个 workflow 提交），必须显式喊出来，
              # 否则会被当成偶发网络抖动而无限重试。
              if git diff --name-only "origin/$BRANCH..HEAD" 2>/dev/null | grep -q '^\.github/workflows/'; then
                echo "跳过：推回 GitHub 被拒 —— 待推送内容含 .github/workflows/ 下的文件，"
                echo "      GITHUB_TOKEN 不具备 workflows 权限，这类提交 Actions 无法代推。"
                echo "      处置：用带 workflow 权限的令牌直推 GitHub（或 GitHub REST API 补推），"
                echo "           GitHub 追平后本链自动恢复；否则本链会一直卡在这一笔。"
              else
                echo "跳过：推回 GitHub 失败（权限或网络）"
              fi
            fi
          done <<< "$MIRRORS"
